name: Build and Push Docker Image

# 构建 reader-rust 多架构 Docker 镜像并推送到 GHCR 及 Docker Hub。
# 触发方式：
#   1) 推送 master 分支自动构建 latest
#   2) 推送版本 tag（如 v1.0.8）自动构建对应版本 tag + latest
#   3) 在 Actions 页面手动运行 (workflow_dispatch)，支持输入自定义 tag
#   4) 被 auto-update-upstream.yml 自动调用 (workflow_call)
#
# 依赖 Secrets (非必填，填入即推送 Docker Hub):
#   - DOCKERHUB_USERNAME: Docker Hub 用户名
#   - DOCKERHUB_TOKEN 或 DOCKERHUB_PASSWORD: Docker Hub 访问令牌或密码

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 1.0.8 或 latest）'
        required: true
        default: 'latest'
  workflow_call:
    inputs:
      ref:
        description: '要构建的 git ref（分支/tag/sha）'
        required: false
        type: string
        default: 'master'
      tag:
        description: '镜像版本 tag（如 1.0.8）'
        required: false
        type: string
        default: 'latest'

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 计算镜像 tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/reader-rust
        run: |
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "latest" ]; then
            V="${INPUT_TAG#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${INPUT_TAG#v}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml || echo "latest")
          fi

          TAGS="${GHCR_REPO}:${V}"
          if [ "$V" != "latest" ]; then
            TAGS="${TAGS},${GHCR_REPO}:latest,${GHCR_REPO}:v${V}"
          fi

          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASS" ]; then
            TAGS="${TAGS},${DOCKERHUB_USER}/reader-rust:${V}"
            if [ "$V" != "latest" ]; then
              TAGS="${TAGS},${DOCKERHUB_USER}/reader-rust:latest,${DOCKERHUB_USER}/reader-rust:v${V}"
            fi
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

          echo "list=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "tag=${V}" >> "$GITHUB_OUTPUT"
          echo "将构建并推送 tags: ${TAGS}"

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端静态资源
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 设置 Rust 环境与 musl 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: 配置 Rust 依赖与构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 musl 交叉编译工具链
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          sudo mkdir -p /opt/musl-cross
          curl --retry 3 --retry-delay 2 -sSL https://musl.cc/x86_64-linux-musl-cross.tgz | sudo tar -xz -C /opt/musl-cross
          curl --retry 3 --retry-delay 2 -sSL https://musl.cc/aarch64-linux-musl-cross.tgz | sudo tar -xz -C /opt/musl-cross
          echo "/opt/musl-cross/x86_64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "/opt/musl-cross/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: 编译 Rust 二进制 (x86_64 & aarch64)
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl
          mkdir -p target-bin/amd64 target-bin/arm64
          cp target/x86_64-unknown-linux-musl/release/reader-rust target-bin/amd64/reader-rust
          cp target/aarch64-unknown-linux-musl/release/reader-rust target-bin/arm64/reader-rust

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.tags.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
